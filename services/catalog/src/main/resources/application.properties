spring.application.name=catalog
server.port=8080

# Tokens are issued for localhost:8080 but keys are fetched on the internal network (ADR-0002).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/shop}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/shop/protocol/openid-connect/certs}

# Keycloak puts realm roles in realm_access.roles; map them to ROLE_<role>.
spring.security.oauth2.resourceserver.jwt.authorities-claim-expressions=['realm_access']?.get('roles') ?: {}
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_

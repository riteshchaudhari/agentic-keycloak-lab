spring.application.name=orders
server.port=8080

# Tokens are issued for localhost:8080 but keys are fetched on the internal network (ADR-0002).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/shop}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/shop/protocol/openid-connect/certs}

# Keycloak puts realm roles in realm_access.roles; map them to ROLE_<role>.
spring.security.oauth2.resourceserver.jwt.authorities-claim-expressions=['realm_access']?.get('roles') ?: {}
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_

# Orders authenticates to the Catalog as itself (ADR-0003). The secret comes from the environment.
spring.security.oauth2.client.registration.catalog.provider=keycloak
spring.security.oauth2.client.registration.catalog.client-id=orders-service
spring.security.oauth2.client.registration.catalog.client-secret=${ORDERS_SERVICE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.catalog.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/shop/protocol/openid-connect/token}

catalog.base-url=${CATALOG_BASE_URL:http://localhost:8082}
